<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Calico policy board</title>
        <link rel="stylesheet" href="calico.css" />
        <!-- The bridge to the app. Served by k8sdockside itself, always at this path. -->
        <script src="/plugin-ui/_sdk/k8sdockside.js"></script>
    </head>
    <body class="page page-board">
        <header class="top">
            <div class="brand">
                <span id="logo"></span>
                <div>
                    <h1>Policy board</h1>
                    <p id="where" class="faint">Connecting…</p>
                </div>
            </div>
            <label class="search">
                <span id="search-icon"></span>
                <input id="query" type="search" placeholder="Find a policy, namespace or selector" autocomplete="off" spellcheck="false" />
            </label>
            <div class="seg" id="mode" role="group" aria-label="Mode"></div>
            <nav class="top-actions" id="top-actions"></nav>
        </header>

        <p id="error" class="banner error" hidden></p>
        <section id="empty" hidden></section>

        <div id="board" class="board" hidden>
            <!-- Namespace, kinds, staged. -->
            <nav id="bar" class="board-bar" aria-label="Filter policies"></nav>
            <!-- How much is protected, and what is not. -->
            <section id="coverage" class="coverage"></section>
            <!-- One lane per tier, in evaluation order. -->
            <main id="lanes" class="lanes"></main>
            <!-- Trace a workload through the tiers. -->
            <section id="trace" hidden></section>
        </div>

        <div id="scrim" class="scrim"></div>
        <aside id="drawer" class="drawer" hidden aria-live="polite"></aside>

        <!-- Classic scripts, not type="module": a sandboxed frame has an opaque
             origin, so a module would be a cross-origin load. -->
        <script src="selector.js"></script>
        <script src="model.js"></script>
        <script src="kit.js"></script>
        <script src="policies.js"></script>
    </body>
</html>
